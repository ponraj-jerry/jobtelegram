name: Job Alert

on:
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST
    - cron: "30 10 * * *"  # 4:00 PM IST
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed to save seen_jobs.json back to the repo

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python job_alert.py

      - name: Save state
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add seen_jobs.json jobs_tracker.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update seen jobs" && git push)
